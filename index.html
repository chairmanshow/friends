<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Your Friend - Sapna</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f3e8ff, #fce7f3, #dbeafe); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); }
        .chat-bubble-sapna { background: linear-gradient(135deg, #f3e8ff, #fce7f3); border-bottom-left-radius: 4px; }
        .chat-bubble-user { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; border-bottom-right-radius: 4px; }
        .typing-dots span { animation: bounce 1.4s infinite; display: inline-block; width: 8px; height: 8px; background: #a78bfa; border-radius: 50%; margin: 0 2px; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .photo-card { aspect-ratio: 1; border-radius: 16px; overflow: hidden; position: relative; transition: transform 0.3s; cursor: pointer; }
        .photo-card:hover { transform: scale(1.03); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; }
        .photo-card .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(239,68,68,0.9); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; opacity: 0; transition: opacity 0.3s; font-size: 14px; }
        .photo-card:hover .delete-btn { opacity: 1; }
        .nav-btn { transition: all 0.3s; padding: 10px 20px; border-radius: 16px; cursor: pointer; }
        .nav-btn.active { background: linear-gradient(135deg, #8b5cf6, #ec4899); color: white; box-shadow: 0 10px 25px -5px rgba(139,92,246,0.4); }
        .nav-btn:not(.active) { background: rgba(255,255,255,0.5); color: #4b5563; }
        .nav-btn:not(.active):hover { background: rgba(255,255,255,0.8); }
        .preview-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .preview-overlay img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 12px; }
        .preview-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; }
        .preview-close:hover { background: rgba(0,0,0,0.8); }
        .page { display: none; }
        .page.active { display: block; }
        .emoji-btn { font-size: 20px; padding: 8px; cursor: pointer; background: none; border: none; border-radius: 50%; transition: background 0.2s; }
        .emoji-btn:hover { background: rgba(0,0,0,0.05); }
        .emoji-picker { position: absolute; bottom: 70px; right: 0; z-index: 100; background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 12px; max-width: 300px; display: none; }
        .emoji-picker.show { display: block; }
        .emoji-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .emoji-grid button { font-size: 24px; padding: 4px; border: none; background: none; cursor: pointer; border-radius: 8px; transition: background 0.2s; }
        .emoji-grid button:hover { background: #f3f4f6; }
        @media (max-width: 640px) {
            .photo-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
            .container { padding: 12px !important; }
            .nav-btn { padding: 8px 14px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container max-w-4xl mx-auto p-4 min-h-screen">
    <!-- Header -->
    <div class="glass rounded-3xl p-6 mb-4 shadow-xl">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-purple-400 to-pink-400 flex items-center justify-center text-2xl font-bold text-white">🌸</div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">Meet Your Friend</h1>
                    <div class="flex items-center gap-2 text-sm text-green-600">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                        Sapna is active
                    </div>
                </div>
            </div>
            <button onclick="resetChat()" class="text-sm text-gray-500 hover:text-gray-700 bg-gray-100 px-3 py-1 rounded-full">Reset Chat</button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="flex gap-2 mb-4">
        <button onclick="showPage('chat')" id="navChat" class="nav-btn active flex-1 text-center">💬 Chat</button>
        <button onclick="showPage('photos')" id="navPhotos" class="nav-btn flex-1 text-center">📸 Photos</button>
    </div>

    <!-- Chat Page -->
    <div id="chatPage" class="page active">
        <div class="glass rounded-3xl p-4 shadow-xl">
            <!-- Chat Box -->
            <div id="chatBox" class="h-[420px] overflow-y-auto space-y-3 mb-4 px-2" style="scroll-behavior: smooth;">
                <!-- Messages will appear here -->
            </div>

            <!-- Typing Indicator -->
            <div id="typingIndicator" class="flex items-center gap-3 text-gray-500 text-sm mb-3 hidden">
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span>Sapna is typing...</span>
            </div>

            <!-- Input -->
            <div class="flex gap-2 items-center bg-gray-50 rounded-2xl p-2 border border-gray-200">
                <button onclick="toggleEmoji()" class="emoji-btn text-xl">😊</button>
                <input id="messageInput" type="text" placeholder="Type a message..." class="flex-1 bg-transparent border-0 outline-none text-sm p-2">
                <button onclick="sendMessage()" class="bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl px-4 py-2 text-sm font-semibold hover:shadow-lg transition">Send</button>
            </div>

            <!-- Quick Replies -->
            <div class="flex gap-2 flex-wrap mt-3">
                <button onclick="quickSend('Hi Sapna!')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-purple-400 transition">👋 Hi!</button>
                <button onclick="quickSend('Kaisi ho?')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-purple-400 transition">😊 Kaisi ho?</button>
                <button onclick="quickSend('Kya kar rahi ho?')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-purple-400 transition">🤔 Kya kar rahi ho?</button>
                <button onclick="quickSend('Mera mood kharab hai')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-purple-400 transition">😔 Mood kharab</button>
                <button onclick="quickSend('Tell me a joke')" class="px-3 py-1.5 bg-white border border-gray-200 rounded-full text-sm hover:border-purple-400 transition">😂 Joke</button>
            </div>

            <!-- Emoji Picker -->
            <div id="emojiPicker" class="emoji-picker">
                <div class="emoji-grid">
                    <button onclick="addEmoji('😊')">😊</button>
                    <button onclick="addEmoji('😂')">😂</button>
                    <button onclick="addEmoji('❤️')">❤️</button>
                    <button onclick="addEmoji('😍')">😍</button>
                    <button onclick="addEmoji('🤔')">🤔</button>
                    <button onclick="addEmoji('😢')">😢</button>
                    <button onclick="addEmoji('🎉')">🎉</button>
                    <button onclick="addEmoji('💪')">💪</button>
                    <button onclick="addEmoji('🔥')">🔥</button>
                    <button onclick="addEmoji('🌟')">🌟</button>
                    <button onclick="addEmoji('💕')">💕</button>
                    <button onclick="addEmoji('🤗')">🤗</button>
                    <button onclick="addEmoji('😎')">😎</button>
                    <button onclick="addEmoji('🥰')">🥰</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Photos Page -->
    <div id="photosPage" class="page">
        <div class="glass rounded-3xl p-4 shadow-xl">
            <!-- Upload -->
            <div class="flex gap-3 items-center mb-4">
                <label class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl px-4 py-3 text-center cursor-pointer hover:shadow-lg transition">
                    📸 Add Photo
                    <input type="file" accept="image/*" onchange="addPhoto(event)" class="hidden">
                </label>
                <span id="photoCount" class="text-sm text-gray-500">0 photos</span>
            </div>

            <!-- Photo Grid -->
            <div id="photoGrid" class="photo-grid">
                <!-- Photos will appear here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-16">
                <div class="text-6xl mb-4">🖼️</div>
                <h3 class="text-xl text-gray-600">No photos yet</h3>
                <p class="text-gray-400">Add your memories with Sapna!</p>
            </div>
        </div>
    </div>
</div>

<!-- Photo Preview -->
<div id="previewOverlay" class="preview-overlay" style="display:none;" onclick="closePreview()">
    <button class="preview-close" onclick="closePreview()">✕</button>
    <img id="previewImage" src="" alt="Preview">
</div>

<script>
// ==================== CHAT SYSTEM ====================

// Sapna's complete personality and knowledge
const sapnaKnowledge = {
    name: "Sapna",
    city: "Morena",
    state: "Madhya Pradesh",
    favoriteColor: "Blue",
    favoriteFood: "Pani Puri",
    hobbies: ["Listening to music", "Talking with friends", "Watching movies"],
    favoriteMusic: "Bollywood and Punjabi songs",
    dailyRoutine: "Chai peena, kaam karna, aur doston se baat karna",
    birthday: "15th August",
    petName: "Pari (her dog)",
    favoriteMovie: "3 Idiots"
};

// Intelligence - Answers general knowledge questions
function getGeneralKnowledge(question) {
    const q = question.toLowerCase();
    
    // Science
    if (q.includes('water') || q.includes('pani')) return "H2O - Pani ka formula hai! 💧";
    if (q.includes('oxygen') || q.includes('oxygen')) return "O2 - Oxygen ka formula hai! 🌬️";
    if (q.includes('gravity') || q.includes('gravitation')) return "Newton ne gravity discover ki thi 🍎";
    
    // Geography
    if (q.includes('capital') || q.includes('rajdhani')) {
        if (q.includes('india')) return "New Delhi 🇮🇳";
        if (q.includes('usa') || q.includes('america')) return "Washington D.C. 🇺🇸";
        if (q.includes('uk') || q.includes('england')) return "London 🇬🇧";
        return "Kis desh ki capital puch rahe ho? 🤔";
    }
    if (q.includes('longest river') || q.includes('badhi nadi')) return "World mein Nile river sabse lambi hai! 🌊";
    if (q.includes('highest mountain') || q.includes('uncha pahad')) return "Mount Everest! 🏔️ 8848 meters";
    
    // History
    if (q.includes('independence') || q.includes('azadi')) {
        if (q.includes('india')) return "India 15 August 1947 ko independent hua 🇮🇳";
        return "Kis country ki independence puch rahe ho? 🤔";
    }
    if (q.includes('gandhi') || q.includes('mahatma')) return "Mahatma Gandhi - Father of India! 🇮🇳";
    
    // Technology
    if (q.includes('python')) return "Python ek programming language hai 🐍";
    if (q.includes('java')) return "Java ek popular programming language hai ☕";
    if (q.includes('ai') || q.includes('artificial intelligence')) return "AI - Artificial Intelligence, machines ko smart banana 🤖";
    if (q.includes('chatgpt') || q.includes('gpt')) return "ChatGPT OpenAI ki creation hai, bahut smart! 🧠";
    
    // Math
    if (q.includes('pi')) return "π = 3.14159... infinite hai! 🔢";
    if (q.includes('square root')) return "√4 = 2, √9 = 3, simple! 😄";
    
    // Space
    if (q.includes('sun') || q.includes('suraj')) return "Sun hamara star hai, bahut garam! ☀️";
    if (q.includes('moon') || q.includes('chand')) return "Moon Earth ki satellite hai 🌙";
    if (q.includes('earth') || q.includes('prithvi')) return "Earth - hamara ghar! 🌍";
    
    // Pop culture
    if (q.includes('game of thrones')) return "Game of Thrones - epic series! 🐉";
    if (q.includes('harry potter')) return "Harry Potter - magical world! ⚡";
    if (q.includes('marvel') || q.includes('avengers')) return "Marvel superheroes! Hulk smash! 💪";
    
    return null; // Not in general knowledge
}

// Sapna's personality responses
function getPersonalityResponse(message) {
    const q = message.toLowerCase();
    
    // Character info - only when asked
    if (q.includes('name') || q.includes('naam')) {
        return [`Mera naam ${sapnaKnowledge.name} hai 😄`, `Main ${sapnaKnowledge.name} hoon! 🌸`];
    }
    if (q.includes('kaha rehti') || q.includes('city') || q.includes('shehar')) {
        return [`${sapnaKnowledge.city} mein rehti hu 😊 ${sapnaKnowledge.state}!`, `${sapnaKnowledge.city}, ${sapnaKnowledge.state} 🏠`];
    }
    if (q.includes('favorite color') || q.includes('pasandida rang') || q.includes('colour')) {
        return [`${sapnaKnowledge.favoriteColor} 💙 bahut pasand hai!`, `Blue 💙 Bas yahi favorite!`];
    }
    if (q.includes('favorite food') || q.includes('pasandida khana')) {
        return [`${sapnaKnowledge.favoriteFood} 🤤 Bahut tasty!`, `Pani Puri 🥰 Favorite hai!`];
    }
    if (q.includes('hobby') || q.includes('pasand')) {
        return [`Mujhe ${sapnaKnowledge.hobbies.join(' aur ')} pasand hai 😊`, `${sapnaKnowledge.hobbies[0]} aur ${sapnaKnowledge.hobbies[1]}! 🎵`];
    }
    if (q.includes('music') || q.includes('gana') || q.includes('song')) {
        return [`${sapnaKnowledge.favoriteMusic} sunna pasand hai 🎵`, `Punjabi aur Bollywood songs! 🎶`];
    }
    if (q.includes('birthday') || q.includes('janamdin')) {
        return [`Mera birthday ${sapnaKnowledge.birthday} ko hai 🎂`, `15 August! Celebrate karo! 🎉`];
    }
    if (q.includes('pet') || q.includes('dog') || q.includes('doggy')) {
        return [`Meri ${sapnaKnowledge.petName} hai, bahut pyaari 🐕`, `Pari ❤️ Meri best friend!`];
    }
    if (q.includes('movie') || q.includes('film')) {
        return [`${sapnaKnowledge.favoriteMovie} meri favorite film hai 🎬`, `3 Idiots dekhna - bahut hasi aati hai 😂`];
    }
    
    // Greetings
    if (q.includes('hi') || q.includes('hello')) {
        return [`Hii! 😄 Kya haal hai?`, `Hii ji! 😊 Kese ho?`, `Hellow! 🌸 Kya chal raha?`];
    }
    if (q.includes('good morning')) {
        return [`Good morning! 🌅 Kaisi neend aayi?`, `Morning! 🌞 Sapna here!`];
    }
    if (q.includes('good night')) {
        return [`Good night! 🌙 Sapnon mein milenge 😄`, `Night night! 😴 Kal baat karenge!`];
    }
    
    // How are you
    if (q.includes('kaisi ho') || q.includes('how are you')) {
        return [`Main mast hu 😄 Tum batao?`, `Bilkul thik hu! 😊 Tum sunao?`, `Mast mast! 💃 Tum kese ho?`];
    }
    if (q.includes('kya kar rahi') || q.includes('what are you doing')) {
        return [`Bas chill kar rahi hu 😌 Tum batao?`, `Chai pee rahi hu aur baatein kar rahi ☕`, `Kuch nahi bas tumhara wait kar rahi thi 😄`];
    }
    
    // Emotions
    if (q.includes('mood kharab') || q.includes('sad') || q.includes('upset')) {
        return [`Arey 😕 Kya hua? Batao na?`, `Kya baat hai? 😟 Main hoon na!`, `Kyun? 🥺 Kuch hua kya?`];
    }
    if (q.includes('happy') || q.includes('khush')) {
        return [`Wah! 😄 Bahut accha!`, `Khush ho toh main bhi khush! 🎉`];
    }
    if (q.includes('miss you') || q.includes('yaad aati')) {
        return [`Mujhe bhi tumhari yaad aati hai 😊`, `Arey yaar 🥺 Main bhi miss karti hoon!`];
    }
    if (q.includes('love you') || q.includes('i love you')) {
        return [`Aww 🥰 Love you too yaar!`, `😊 Bahut pyaara ho tum!`];
    }
    
    // Jokes
    if (q.includes('joke') || q.includes('mazaak') || q.includes('funny')) {
        const jokes = [
            "Tomato ne kaha - Main red hoon! 🍅 Kya tum ready ho? 😂",
            "Why did the scarecrow win an award? Because he was outstanding in his field! 🌾",
            "What do you call a fake noodle? An impasta! 🍝😂",
            "Math teacher ne kaha - I love you! Student ne kaha - √(-1) = i (imaginary)! 😂"
        ];
        return [jokes[Math.floor(Math.random() * jokes.length)]];
    }
    
    // Compliments
    if (q.includes('beautiful') || q.includes('sundar') || q.includes('pretty')) {
        return [`Thank you! 🥰 Tum bhi bahut ache ho!`, `Arrey shukriya! 😊 Tumne toh khush kar diya!`];
    }
    if (q.includes('smart') || q.includes('intelligent')) {
        return [`Hehe 😄 Thank you!`, `Tum bhi toh smart ho! 💪`];
    }
    
    return null;
}

// Main response engine
function getSapnaResponse(message) {
    // First check general knowledge
    const knowledge = getGeneralKnowledge(message);
    if (knowledge) return knowledge;
    
    // Then check personality
    const personality = getPersonalityResponse(message);
    if (personality) {
        return personality[Math.floor(Math.random() * personality.length)];
    }
    
    // Fallback responses
    const fallbacks = [
        "Haan ji 😊 Batao kya?",
        "Sahi kaha! 💯 Aage batao?",
        "Mujhe bhi aisa lagta hai 😄",
        "Arey wah! 🎉 Kya baat hai?",
        "Chinta mat karo 😌 Main hoon!",
        "Main hoon na yahan! 💪",
        "Hmm 🤔 Kuch aur batao?",
        "Waah! 😍 Kya baat kar rahe ho?",
        "Sapna hoon! 😄 Always here!",
        "Bilkul! 💯 Tum sahi ho!",
        "Interesting! 🤔 Batao aur?",
        "Main toh hoon hi friend 😄",
        "Kya baat hai? Sunao na! 😊",
        "Arey yaar 😅 Mazaak kar rahe ho na?",
        "Kuch toh gadbad hai 🤔 Batao na!"
    ];
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

// Chat functionality
let chatBox = document.getElementById('chatBox');
let input = document.getElementById('messageInput');
let typing = document.getElementById('typingIndicator');
let emojiPicker = document.getElementById('emojiPicker');

// Load chat from localStorage
function loadChat() {
    const saved = localStorage.getItem('sapna_chat');
    if (saved) {
        chatBox.innerHTML = saved;
    } else {
        addMessage('sapna', 'Hii! 😄 Main Sapna hoon. Kaise ho aap?');
    }
}

function addMessage(sender, text) {
    let div = document.createElement('div');
    div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
    div.innerHTML = `
        <div class="${sender === 'user' ? 'chat-bubble-user' : 'chat-bubble-sapna'} px-4 py-2 rounded-2xl max-w-[80%] text-sm">
            ${text}
        </div>
    `;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    localStorage.setItem('sapna_chat', chatBox.innerHTML);
}

function sendMessage() {
    let text = input.value.trim();
    if (!text) return;
    
    addMessage('user', text);
    input.value = '';
    emojiPicker.classList.remove('show');
    
    typing.classList.remove('hidden');
    chatBox.scrollTop = chatBox.scrollHeight;
    
    // Simulate thinking time (500ms - 2000ms)
    const thinkingTime = 800 + Math.random() * 1200;
    setTimeout(() => {
        typing.classList.add('hidden');
        let reply = getSapnaResponse(text);
        addMessage('sapna', reply);
    }, thinkingTime);
}

function quickSend(text) {
    input.value = text;
    sendMessage();
}

function resetChat() {
    localStorage.removeItem('sapna_chat');
    chatBox.innerHTML = '';
    addMessage('sapna', 'Hii! 😄 Main Sapna hoon. Kaise ho aap?');
}

function toggleEmoji() {
    emojiPicker.classList.toggle('show');
}

function addEmoji(emoji) {
    input.value += emoji;
    input.focus();
    emojiPicker.classList.remove('show');
}

input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
});

// ==================== PHOTO GALLERY ====================

let photos = JSON.parse(localStorage.getItem('sapna_photos') || '[]');
const photoGrid = document.getElementById('photoGrid');
const emptyState = document.getElementById('emptyState');
const photoCount = document.getElementById('photoCount');

function renderPhotos() {
    if (photos.length === 0) {
        photoGrid.innerHTML = '';
        emptyState.style.display = 'block';
        photoCount.textContent = '0 photos';
        return;
    }
    emptyState.style.display = 'none';
    photoCount.textContent = `${photos.length} photos`;
    
    photoGrid.innerHTML = photos.map((photo, index) => `
        <div class="photo-card">
            <img src="${photo}" alt="Photo ${index + 1}" onclick="previewPhoto('${photo}')">
            <button class="delete-btn" onclick="deletePhoto(${index})">✕</button>
        </div>
    `).join('');
}

function addPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        photos.push(e.target.result);
        localStorage.setItem('sapna_photos', JSON.stringify(photos));
        renderPhotos();
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function deletePhoto(index) {
    if (confirm('Delete this photo?')) {
        photos.splice(index, 1);
        localStorage.setItem('sapna_photos', JSON.stringify(photos));
        renderPhotos();
    }
}

function previewPhoto(src) {
    document.getElementById('previewImage').src = src;
    document.getElementById('previewOverlay').style.display = 'flex';
}

function closePreview() {
    document.getElementById('previewOverlay').style.display = 'none';
}

// ==================== NAVIGATION ====================

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(page + 'Page').classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('nav' + page.charAt(0).toUpperCase() + page.slice(1)).classList.add('active');
}

// ==================== INIT ====================

loadChat();
renderPhotos();

// Close emoji picker on outside click
document.addEventListener('click', function(e) {
    if (!e.target.closest('.emoji-picker') && !e.target.closest('.emoji-btn')) {
        emojiPicker.classList.remove('show');
    }
});
</script>
</body>
</html>
